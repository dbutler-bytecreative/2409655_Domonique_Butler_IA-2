<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Coding Conf | Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <!--Small Branding-->
      <header class="page-brand">
        <a href="index.html">
          <img src="assets/logo-mark.svg" alt="Coding Conf logo" />
          <span>CODING CONF</span>
        </a>
      </header>

      <!--Registration Page Heading-->
      <section>
        <h1>Register for Coding Conf 2026</h1>
        <p>
          Join us for an unforgettable day filled with coding, learning and
          networking
        </p>
      </section>

      <!--Form + novalidate to allow JavaScript to take over validations -->
      <form id="registration-form" novalidate>
        <!--Full Name-->
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName" required />

        <p id="name-error"></p>

        <!--Email-->
        <label for="user-email">Email</label>
        <input type="email" id="user-email" name="userEmail" required />

        <p id="email-error"></p>

        <!--GitHub-->
        <!--GitHub-->
        <label for="user-name">GitHub Username</label>

        <div class="github-input">
          <img src="assets/icon-github.svg" alt="GitHub" />

          <input
            type="text"
            id="user-name"
            name="githubUser"
            placeholder="@username"
            required
          />
        </div>

        <p id="github-error"></p>

        <!--Avatar-->
        <label for="user-avatar">Your Avatar</label>

        <div class="avatar-upload">
          <img id="avatar-preview" alt="preview" />

          <label for="user-avatar" class="upload">
            <img src="assets/icon-upload.svg" alt="" />
            <span>Drag and drop or click to upload your avatar</span>
          </label>

          <input
            type="file"
            id="user-avatar"
            name="userAvatar"
            accept="image/jpeg, image/png"
            required
          />
        </div>

        <div class="instructions">
          <img src="assets/icon-info.svg" alt="info icon" />
          <p>Upload a JPG or PNG image. Maximum file size: 500KB.</p>
        </div>

        <p id="avatar-error"></p>

        <button type="submit" id="submit-button">Generate My Ticket</button>
      </form>
    </main>
    <script src="js/validation.js"></script>
  </body>
</html>
